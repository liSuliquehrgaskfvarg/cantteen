<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伙委管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;min-height:100vh;padding:12px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{font-size:1.3rem;font-weight:700;color:#1a1a2e;margin-bottom:4px}
h2{font-size:1rem;font-weight:700;color:#374151;margin-bottom:12px}
.subtitle{font-size:.82rem;color:#6b7280}
.btn{padding:10px 20px;border-radius:10px;border:none;font-size:.95rem;font-weight:700;cursor:pointer;transition:.15s}
.btn-primary{background:#4f46e5;color:#fff;width:100%;padding:12px;margin-top:8px}
.btn-primary:hover{background:#4338ca}
.btn-primary:disabled{background:#a5b4fc;cursor:not-allowed}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-box{background:#f9fafb;border-radius:10px;padding:14px;text-align:center}
.stat-num{font-size:1.8rem;font-weight:800;color:#4f46e5}
.stat-label{font-size:.75rem;color:#6b7280;margin-top:2px}
/* Day section */
.day-section{margin-bottom:12px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.day-hdr{background:#dbeafe;padding:9px 14px;display:flex;align-items:center;justify-content:space-between}
.day-hdr-title{color:#1e40af;font-weight:700;font-size:.9rem}
.day-hdr-count{font-size:.78rem;color:#3b82f6;font-weight:600}
.day-grid{padding:8px 6px 10px;display:grid;grid-template-columns:repeat(17,1fr);gap:3px}
.seat{display:flex;align-items:center;justify-content:center;height:26px;border-radius:4px;font-size:9.5px;font-weight:700;border:1px solid #e5e7eb;color:#6b7280;background:#f9fafb}
.seat.ordered{background:#f97316;border-color:#ea6c00;color:#fff}
.day-closed{padding:10px 14px;font-size:.82rem;color:#9ca3af;font-style:italic}
/* Settings */
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
label{font-size:.8rem;font-weight:600;color:#374151}
input,select{padding:8px 12px;border:2px solid #e5e7eb;border-radius:8px;font-size:.9rem;outline:none}
input:focus,select:focus{border-color:#4f46e5}
.status-banner{padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;margin-bottom:12px}
.status-ok{background:#d1fae5;color:#065f46}
.status-err{background:#fee2e2;color:#991b1b}
.status-warn{background:#fef3c7;color:#92400e}
.section-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;font-weight:700;margin-bottom:10px}
</style>
</head>
<body>
<div class="card">
  <h1>📋 伙委管理</h1>
  <p class="subtitle">查看本週訂餐狀況</p>
  <button class="btn btn-primary" id="btn-refresh" onclick="loadData()">🔄 載入本週資料</button>
  <p class="subtitle" id="poll-status" style="margin-top:8px;font-size:.78rem;color:#9ca3af;text-align:center;display:none">⏱ 自動更新中 · 上次更新：<span id="last-update">--</span></p>
</div>
<div id="status-msg"></div>
<div id="summary" style="display:none">
  <div class="card">
    <p class="section-title">本週概覽</p>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num" id="count-submitted">–</div><div class="stat-label">已填</div></div>
      <div class="stat-box"><div class="stat-num" id="count-missing">–</div><div class="stat-label">未填</div></div>
    </div>
  </div>
  <div id="day-grids"></div>
</div>
<div class="card">
  <h2>⚙️ 設定</h2>
  <div id="settings-msg"></div>
  <div class="form-row">
    <label>班級人數</label>
    <input type="number" id="s-classSize" placeholder="例：40" min="1" max="60" oninput="autoSaveLocal(this)">
  </div>
  <div class="form-row">
    <label>伙委 Gmail（自動寄報表用）</label>
    <input type="email" id="s-adminEmail" placeholder="xxxxx@gmail.com">
  </div>
  <div class="form-row">
    <label>截止星期</label>
    <select id="s-deadlineWeekday">
      <option value="1">週一</option>
      <option value="2">週二</option>
      <option value="3">週三</option>
      <option value="4">週四</option>
      <option value="5">週五</option>
    </select>
  </div>
  <div class="form-row">
    <label>截止時間（24h）</label>
    <input type="time" id="s-deadlineTime" value="23:59">
  </div>
  <div class="form-row">
    <label>備註（顯示在學生頁面）</label>
    <input type="text" id="s-note" placeholder="例：本週五不供餐">
  </div>
  <button class="btn btn-primary" id="btn-settings" onclick="saveSettings()">💾 儲存設定</button>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbxbhWetXnvyuxTmmqoNP76PiO-IY17K0-gkEiHYCm7gNJdGhqwP2kuxAkd8VwNrvi2N/exec';
let weekData=null,settingsSaved=false;
let pollTimer=null;
async function pollData(){
  try{
    const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'submitOrder',seatNo:1})});
    const data=await resp.json();
    if(data.error)return;
    const prevSize=(weekData?.submittedSeats||[]).length;
    weekData=data;
    if((data.submittedSeats||[]).length!==prevSize) renderSummary();
    const t=new Date();
    document.getElementById('last-update').textContent=t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0')+':'+t.getSeconds().toString().padStart(2,'0');
  }catch(e){}
}
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(pollData,20000);
  document.getElementById('poll-status').style.display='block';
}
function saveLocalSettings(s){try{localStorage.setItem('cantteen_settings',JSON.stringify(s));}catch(e){}}
function loadLocalSettings(){try{const s=localStorage.getItem('cantteen_settings');return s?JSON.parse(s):null;}catch(e){return null;}}
function autoSaveLocal(el){const cur=loadLocalSettings()||{};cur.classSize=parseInt(el.value)||40;saveLocalSettings(cur);}

function showMsg(id,html,type=''){
  document.getElementById(id).innerHTML=html?`<div class="status-banner status-${type}">${html}</div>`:'';
}

async function loadData(){
  document.getElementById('btn-refresh').disabled=true;
  showMsg('status-msg','載入中…','warn');
  document.getElementById('summary').style.display='none';
  try{
    const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'submitOrder',seatNo:1})});
    weekData=await resp.json();
    if(weekData.error){showMsg('status-msg',weekData.error,'err');return;}
    showMsg('status-msg','');
    // Populate settings from localStorage FIRST (so renderSummary reads correct classSize)
    const local=loadLocalSettings();
    const src=local||weekData||{};
    if(src.classSize) document.getElementById('s-classSize').value=src.classSize;
    if(src.deadlineWeekday) document.getElementById('s-deadlineWeekday').value=src.deadlineWeekday;
    if(src.deadlineTime) document.getElementById('s-deadlineTime').value=src.deadlineTime;
    if(src.note!==undefined) document.getElementById('s-note').value=src.note;
    settingsSaved=false;
    renderSummary();
    startPolling();
  }catch(e){showMsg('status-msg','錯誤：'+e.message,'err');console.error(e);}
  finally{document.getElementById('btn-refresh').disabled=false;}
}

function renderSummary(){
  const d=weekData;
  const submitted=new Set(d.submittedSeats||[]);
  const missing=d.notSubmitted||[];
  const classSize=parseInt(document.getElementById('s-classSize').value)||d.classSize||40;
  document.getElementById('count-submitted').textContent=submitted.size;
  document.getElementById('count-missing').textContent=missing.length;

  // Build per-day grids
  const days=d.days||[];
  const isLocked=(d.locked)||false;
  let html='';
  days.forEach(day=>{
    if(!day.lunchEnabled && !day.dinnerEnabled) return;
    const orderedCount=submitted.size+1; // +1 for teacher

    html+=`<div class="day-section">`;
    html+=`<div class="day-hdr"><span class="day-hdr-title">📅 ${day.dateLabel}</span>`;
    if(!isLocked) html+=`<span class="day-hdr-count">🟠 ${orderedCount} 人</span>`;
    html+=`</div>`;

    if(isLocked){
      html+=`<div class="day-closed">🔒 點餐已截止</div>`;
    } else {
      html+=`<div class="day-grid">`;
      html+=`<div class="seat ordered">師</div>`;
      for(let s=1;s<=classSize;s++){
        const isOrdered=submitted.has(s);
        html+=`<div class="seat${isOrdered?' ordered':''}">${String(s).padStart(2,'0')}</div>`;
      }
      html+=`</div>`;
    }
    html+=`</div>`;
  });
  document.getElementById('day-grids').innerHTML=html;
  document.getElementById('summary').style.display='block';
}

async function saveSettings(){
  const btn=document.getElementById('btn-settings');
  btn.disabled=true;btn.textContent='儲存中…';
  const settings={
    action:'updateSettings',
    classSize:parseInt(document.getElementById('s-classSize').value)||40,
    adminEmail:document.getElementById('s-adminEmail').value.trim(),
    deadlineWeekday:parseInt(document.getElementById('s-deadlineWeekday').value),
    deadlineTime:document.getElementById('s-deadlineTime').value,
    note:document.getElementById('s-note').value.trim()
  };
  // Save locally first — always succeeds
  saveLocalSettings(settings);
  settingsSaved=true;
  showMsg('settings-msg','✅ 設定已儲存','ok');
  // Try syncing to API in background (ignore errors)
  try{
    const resp=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(settings)});
    await resp.json();
  }catch(e){}
  finally{btn.disabled=false;btn.textContent='💾 儲存設定';}
}

loadData();
</script>
</body>
</html>
